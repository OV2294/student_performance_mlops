stages:
  generate_data:
    cmd: python -m src.generate_data
    deps:
      - src/generate_data.py
    params:
      - data
    outs:
      - data/raw/students.csv

  preprocess:
    cmd: python -m src.preprocess
    deps:
      - src/preprocess.py
      - data/raw/students.csv
    params:
      - split
    outs:
      - data/processed

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/pipeline.py
      - data/processed
    params:
      - train
    outs:
      - models/model.joblib
    metrics:
      - reports/metrics.json:
          cache: false

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - reports/metrics.json

  monitor:
    cmd: python -m src.monitor
    deps:
      - src/monitor.py
      - data/processed/reference.csv
    params:
      - monitor
    outs:
      - reports/drift_report.json:
          cache: false
